<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JRS JOSHIM Admin</title><link rel="stylesheet" href="/style.css"></head><body class="adminBody"><header><div class="nav wrap"><a class="logo" href="/">JRS <b>JOSHIM</b> / ADMIN</a><a href="/">দোকান দেখুন ↗</a></div></header><main class="wrap adminMain"><div id="loginPanel" class="adminCard"><small>PRIVATE ADMIN AREA</small><h1>অ্যাডমিন লগইন</h1><form id="loginForm"><input name="username" placeholder="ইউজারনেম" required><input name="password" type="password" placeholder="পাসওয়ার্ড" required><button class="goldBtn">লগইন</button></form><p id="loginMsg" class="msg"></p><p class="muted">প্রথমবার চালুর আগে .env ফাইলে অ্যাডমিন ইউজারনেম ও শক্তিশালী পাসওয়ার্ড সেট করুন।</p></div>
<div id="dashboard" hidden><div class="dashHead"><div><small>STORE MANAGEMENT</small><h1>অ্যাডমিন ড্যাশবোর্ড</h1></div><button class="lineBtn" onclick="logout()">লগআউট</button></div><div class="tabs"><button class="tab active" onclick="showTab('productsTab',this)">পণ্য</button><button class="tab" onclick="showTab('ordersTab',this)">অর্ডার</button><button class="tab" onclick="showTab('bannersTab',this)">বিজ্ঞাপন</button></div>
<section id="productsTab" class="adminCard"><h2>নতুন পণ্য যোগ করুন</h2><form id="productForm" class="adminForm"><input name="name" placeholder="পণ্যের নাম" required><select name="category"><option>জুতা</option><option>টি-শার্ট</option><option>গেঞ্জি</option><option>শার্ট</option><option>অন্যান্য</option></select><input name="price" type="number" min="1" placeholder="বিক্রয় মূল্য (৳)" required><input name="old_price" type="number" placeholder="আগের দাম (ঐচ্ছিক)"><input name="sizes" placeholder="সাইজ (যেমন: 40,41,42 বা M,L,XL)"><input name="stock" type="number" min="0" placeholder="স্টক সংখ্যা"><input name="imageFile" type="file" accept="image/png,image/jpeg,image/webp"><textarea name="description" placeholder="পণ্যের বিবরণ"></textarea><button class="goldBtn">পণ্য প্রকাশ করুন</button></form><p id="productMsg" class="msg"></p><h2>তোমার পণ্যসমূহ</h2><div id="adminProducts"></div></section>
<section id="ordersTab" class="adminCard" hidden><h2>কাস্টমার অর্ডার</h2><div id="adminOrders"></div></section>
<section id="bannersTab" class="adminCard" hidden><h2>বিজ্ঞাপন / অফার যোগ করুন</h2><form id="bannerForm" class="adminForm"><input name="title" placeholder="বিজ্ঞাপনের শিরোনাম" required><input name="subtitle" placeholder="বিজ্ঞাপনের বিস্তারিত"><input name="image" placeholder="ছবির URL (ঐচ্ছিক)"><button class="goldBtn">বিজ্ঞাপন প্রকাশ করুন</button></form><div id="adminBanners"></div></section></div></main><script src="/admin.js"></script></body></html>
